# VoxelMind Local: the companion runs entirely inside this mod.
# Per-target values (minecraft_version, fabric_version, loader_version, java_version)
# live in versions/<mc>/gradle.properties. Minecraft 1.21.x builds with Java 21, 26.x with Java 25.
mod_version=0.5.0
maven_group=com.voxelmind
archives_base_name=voxelmind-local

org.gradle.jvmargs=-Xmx3G
