pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.kikugie.dev/releases" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.5.2"
}

stonecutter {
    kotlinController = false
    centralScript = "build.gradle"
    // Same 16 targets as the VoxelMind Companion mod. The checked-in source
    // is the Minecraft 26.2 state (vcsVersion); older targets are derived from
    // it by Stonecutter comment blocks plus the regex renames in build.gradle.
    create(rootProject) {
        versions("1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.1.1", "26.1.2", "26.2")
        vcsVersion = "26.2"
    }
}

rootProject.name = "voxelmind-local"
